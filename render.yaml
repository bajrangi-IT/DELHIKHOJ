databases:
  - name: delhikhoj-db
    plan: free

services:
  - type: web
    name: delhikhoj
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: delhikhoj-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_OPTIONS
        value: "--max-old-space-size=300"
